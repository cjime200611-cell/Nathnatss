<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nathnatss</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    
    <main class="contact-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-contacto">

        <!--Boton para cerrar el modal-->
        <button type="button" class="close-button" id="cerrar-modal" aria-label="Close form">
            &times;
        </button>

        <div class="contact-content">

            <!--Columna izquierda información de contacto-->
            <section class="contact-info">
                <span class="contact-label">LET'S TALK</span>

                <h1 id="titulo-contacto">
                    Got a project<br>
                    in mind?
                </h1>

                <p>I would love to hear about it. Whether it's a
                    new idea, a collaboration or just a question,
                    feel free to reach out.</p>

                <div class="social-links">

                    <!--Instagram-->
                    <a href="https://www.instagram.com/nathnatss/" target="_blank" rel="noopener noreferrer" class="social-link">
                        <img src="/IMG/Icon Insta.png" alt="instagram">

                        <span>@nathnatss</span>
                    </a>

                    <!--Linkedin-->
                    <a href="https://www.linkedin.com/in/nathaliedelg/" target="_blank" rel="noopener noreferrer" class="social-link">
                        <img src="/IMG/Icon Link.png" alt="linkedin">

                        <span>Nathalie Delgado A.</span>
                    </a>

                </div>

            </section>

            <!--Columna derecha-->
            <section class="contact-form-container">

                <!--ESTADO 1: Formulario-->
                <form id="formulario" novalidate>

                    <!--Nombre o empresa-->
                    <div class="grupo-nombre">

                        <label for="nombre">Name or Company</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Your name or company" required aria-describedby="error-nombre">

                        <span id="error-nombre" class="error"></span>

                    </div>
                    
                    <!--Email-->
                    <div class="grupo-email">

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="your@gmail.com" required aria-describedby="error-email">

                        <span id="error-email" class="error"></span>

                    </div>

                    <!--Número de telefono-->
                    <div class="grupo-telefono">

                        <label for="telefono">Phone number</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Your phone number" required aria-describedby="error-telefono">

                        <span id="error-telefono" class="error"></span>

                    </div>

                    <!--Seleccion de servicio-->
                    <div class="grupo-servicio">

                        <label for="servicio">What service do you need?</label>
                        <select id="servicio" name="servicio" required aria-describedby="error-servicio">

                            <option value="" selected disabled>
                                Select an option
                            </option>

                            <option value="commercial-visualization">
                                Commercial visualization
                            </option>

                            <option value="3d-illustration">
                                3D Illustration
                            </option>

                            <option value="custom-ilustractions">
                                Custom Illustrations
                            </option>

                            <option value="creative-idea">
                                Other / Something Different
                            </option>

                        </select>

                        <span id="error-servicio" class="error"></span>
                    
                    </div>

                    <!--Mensaje-->
                    <div class="grupo-mensaje">

                        <label for="mensaje">Tell me about your project</label>
                        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Your message" required aria-describedby="error-mensaje"></textarea>

                        <span id="error-mensaje" class="error"></span>

                    </div>

                    <!--Botón para enviar el formulario-->
                    <button type="submit" class="boton">
                        Send message ↗
                    </button>

                </form>

                <!--ESTADO 2: Mensaje de enviado-->
                <div id="mensaje-exito" class="mensaje-exito" hidden>
                    
                    <div class="icono-exito">
                        ✓
                    </div>

                    <h2>Message sent successfully</h2>
                    <p>Thank you for contacting me.<br>
                        I will get back to you within 48 hours.</p>

                </div>

            </section>

        </div>

    </main>
    <script src="/JS/script.js"></script>
</body>
</html>
