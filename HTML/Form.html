<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nathnatss</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="contact-modal">

        <button type="button" class="close-button" aria-label="Close form">
            &times;
        </button>

        <div class="contact-content">

            <!-- Informacion de contacto -->
            <section class="contact-info">

                <h1>Let's talk about your project!</h1>

                <p>
                    Tell me about your idea, and let's work together
                    to make it a reality.
                </p>

                <h2>You can also find me at:</h2>

                <div class="social-links">

                    <a href="https://www.instagram.com/nathnatss/"
                    target="_blank"
                    rel="noopener noreferrer">
                        Instagram
                        <span>@nathnatss</span>
                    </a>

                    <a href="#" target="_blank">
                        LinkedIn
                    </a>

                </div>

            </section>

            <!-- Formulario -->
            <section class="contact-form-container">

                <form id="formulario" novalidate>

                    <div class="grupo-nombre">
                        <label for="nombre">Name or Company</label>
                        <input type="text" id="nombre" name="nombre"
                            placeholder="Your name or company">
                        <span id="error-nombre" class="error"></span>
                    </div>

                    <div class="grupo-email">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                            placeholder="your@email.com">
                        <span id="error-email" class="error"></span>
                    </div>

                    <div class="grupo-servicio">
                        <label for="servicio">What service do you need?</label>

                        <select id="servicio" name="servicio">
                            <option value="" selected disabled>
                                Select an option
                            </option>
                            <option value="commercial-visualization">
                                Commercial Visualization
                            </option>
                            <option value="3d-illustration">
                                3D Illustration
                            </option>
                            <option value="custom-illustrations">
                                Custom Illustrations
                            </option>
                            <option value="creative-idea">
                                I Have an Idea!
                            </option>
                        </select>

                        <span id="error-servicio" class="error"></span>
                    </div>

                    <div class="grupo-mensaje">
                        <label for="mensaje">Tell me about your project</label>
                        <textarea id="mensaje" name="mensaje" rows="4"
                                placeholder="Briefly describe your idea..."></textarea>
                        <span id="error-mensaje" class="error"></span>
                    </div>

                    <button type="submit" class="boton">
                        Send message ↗
                    </button>

                </form>

                <!-- Confirmacion de envio -->
                <div id="mensaje-exito" hidden>
                    <div class="icono-exito">✓</div>

                    <h2>Message sent successfully!</h2>

                    <p>
                        Thank you for contacting me.
                        I'll get back to you as soon as possible.
                    </p>

                    <button type="button" id="volver-portafolio">
                        Back to portfolio
                    </button>
                </div>

            </section>

        </div>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
