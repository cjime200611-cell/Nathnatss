<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nathnatss</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <main class="contact-modal">

        <!-- Boton para cerrar -->
        <button type="button" class="close-button" aria-label="Close form">
            &times;
        </button>

        <div class="contact-content">

            <!-- Información de contacto -->
            <section class="contact-content">

                <span class="etiqueta">LET´S TALK</span>
                <h1> Got a project<br>in mind?</h1>

                <p class="descripcion">
                    I would love to hear about it. Whether it´s a new
                    idea, a collaboration or just a question,
                    feel free to reach out.
                </p>

                <div class="social-section">

                    <h2>FIND ME HERE</h2>
                    <div class="social-links">
                        <a href="https://www.instagram.com/nathnatss/"target="_blank" rel="noopener noreferrer">
                            <span class="social-icon">@</span><span>@nathnatss</span>
                        </a>
                    </div>

                </div>
            </section>

            
        </div>
    </main>
</body>
</html>
